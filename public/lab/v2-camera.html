<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Lab (v2)</title>
<style>
  :root { --bg: #181425; --fg: #c0cbdc; --ui: #262b44; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 monospace; }
  #screen { display: block; width: 1152px; height: 648px; image-rendering: pixelated; background: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: var(--ui); align-items: center; }
  button, select { background: #3a4466; color: #fff; border: 0; padding: 4px 8px; font: inherit; }
  #t { width: 360px; }
</style>
</head>
<body>
<!-- CAMERA stream lab: framing gallery, move player, storyboard of a real
     episode through planSegment. window.__lab: see js/v2/canvas25d/labs/camera.js -->
<canvas id="screen" width="384" height="216"></canvas>
<div class="bar">
  <select id="mode"><option>gallery</option><option>move</option><option>storyboard</option><option>framing</option></select>
  <select id="programme"><option>world-now</option><option>tech-bytes</option><option>cosmos</option><option>money-minute</option><option>news-60</option><option>full-time</option></select>
  <select id="hour" title="the studio clock (WORLD NOW's city, FULL TIME's ground)"><option value="23">night 23:00</option><option value="6.5">dawn 06:30</option><option value="12.5">day 12:30</option><option value="17.5">golden 17:30 (1 bank)</option><option value="18.7">golden 18:42 (4 banks)</option><option value="20">blue hour 20:00</option></select>
  <select id="zoom"><option value="3">3x</option><option value="1">1x</option><option value="4">4x</option></select>
  <select id="move"><option>greeting</option><option>lead</option><option>signoff</option><option>catch</option></select>
  <label><input type="checkbox" id="overlay"> overlay</label>
  <button id="play">play</button>
  <input id="t" type="range" min="0" max="20" step="0.01" value="0">
  <span id="info"></span>
</div>
<script type="module">
  import { createCameraLab } from '../js/v2/canvas25d/labs/camera.js';
  const canvas = document.getElementById('screen');
  const lab = createCameraLab(canvas);
  window.__lab = lab;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  for (const k of ['mode', 'programme', 'move', 'framing', 'focus']) if (params.has(k)) lab.set({ [k]: params.get(k) });
  if (params.has('overlay')) lab.set({ overlay: true });
  if (params.has('labels')) lab.set({ labels: true });
  $('mode').value = lab.state.mode;
  $('programme').value = lab.state.programme;
  function redraw() { lab.render(Number($('t').value)); }
  // the studio clock's hour (FULL TIME's ground and WORLD NOW's city follow it) and the display scale (1x, 3x, 4x)
  if (params.has('hour')) $('hour').value = params.get('hour');
  lab.set({ hour: Number($('hour').value) });
  const zoom = () => { const z = Number($('zoom').value); canvas.style.width = `${384 * z}px`; canvas.style.height = `${216 * z}px`; };
  if (params.has('zoom')) $('zoom').value = params.get('zoom');
  zoom();
  $('hour').onchange = () => { lab.set({ hour: Number($('hour').value) }); redraw(); };
  $('zoom').onchange = zoom;
  $('mode').onchange = () => { lab.set({ mode: $('mode').value }); redraw(); };
  $('programme').onchange = () => { lab.set({ programme: $('programme').value }); redraw(); };
  $('move').onchange = () => { lab.set({ move: $('move').value }); redraw(); };
  $('overlay').onchange = () => { lab.set({ overlay: $('overlay').checked }); redraw(); };
  $('t').oninput = redraw;
  let playing = false, t0 = 0;
  $('play').onclick = () => { playing = !playing; t0 = performance.now() - Number($('t').value) * 1000; };
  function loop() {
    if (playing) {
      const t = (performance.now() - t0) / 1000;
      $('t').value = t % 20;
      lab.render(t % 20);
    }
    requestAnimationFrame(loop);
  }
  lab.render(0);
  if (!params.has('still')) loop();
</script>
</body>
</html>
