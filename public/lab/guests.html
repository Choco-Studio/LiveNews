<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guests Lab</title>
<style>
  :root { --bg: #181425; --fg: #c0cbdc; --ui: #262b44; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 monospace; }
  #screen { display: block; width: 1152px; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; background: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: var(--ui); align-items: center; }
  button, select, label { background: #3a4466; color: #fff; border: 0; padding: 4px 8px; font: inherit; }
</style>
</head>
<body>
<!-- IN THEIR WORDS, re-staged (server/guests/restage.js): seeded bookings (tools/guests-lab.mjs writes guests.json with
     the server's own bookGuest) in the press room through the real v2 Stage and the real graphics (the RECREATION label,
     the name super, the words in the captions). The guest speaks for 3 s, then pauses 1 s (a stand-in for the speech
     clock: the mouth moves, no sound). ?guest=3 picks one, ?grave=1 stages them soberly, ?graphics=0 hides the overlay,
     ?still=1 holds the picture; window.__lab.show(i, t) draws guest i at time t (tools/shoot.mjs --step). -->
<canvas id="screen" width="384" height="216"></canvas>
<div class="bar">
  <select id="guest"></select>
  <label><input type="checkbox" id="grave"> grave</label>
  <label><input type="checkbox" id="gfx" checked> graphics</label>
  <button id="play">pause</button>
  <span id="info"></span>
</div>
<script type="module">
import { Stage } from '../js/v2/canvas25d/runtime/stage.js';
import { Graphics } from '../js/graphics/index.js';
import { recreationOf } from '../js/graphics/recreation.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const { guests } = await (await fetch('./guests.json')).json();
guests.forEach((g, i) => $('guest').add(new Option(`${i}: ${g.booking.strap.name}${g.grave ? ' (grave)' : ''}`, String(i))));
$('guest').value = String(Math.min(guests.length - 1, Math.max(0, Number(q.get('guest')) || 0)));
$('grave').checked = q.get('grave') === '1';
$('gfx').checked = q.get('graphics') !== '0';
const WORDS = 'We will publish the details of the plan next week. Every region will be consulted before it goes ahead.';
const VIS = ['AA', 'EH', 'OO', 'MM', 'EE', 'rest', 'AA', 'FF'];
const audio = {
  speechFrame(ms, slot, o = {}) {
    const k = Math.floor(ms / 110), cyc = ms % 4000;
    const on = slot === 'R1' && cyc < 3000;
    o.slot = slot; o.speaking = on; o.level = on ? 0.55 : 0; o.viseme = on ? VIS[k % VIS.length] : 'rest';
    o.next = on ? VIS[(k + 1) % VIS.length] : 'rest'; o.mix = on ? (ms % 110) / 110 : 0;
    o.wordIndex = -1; o.charIndex = -1; o.sentenceIndex = on ? Math.floor(ms / 4000) : -1; o.accent = 0; o.pause = false;
    return o;
  },
};
const programs = [['world-now', 'world', { A: 'paco', B: 'lola' }], ['tech-bytes', 'tech', { A: 'max', B: 'ada' }], ['money-minute', 'money', { A: 'penny' }], ['cosmos', 'space', { A: 'nova', B: 'unit8' }]];
let stage = null, scene = null, graphics = null;
function build(i = Number($('guest').value)) {
  const g = guests[i];
  const b = g.booking;
  const grave = g.grave || $('grave').checked;
  const [pid, theme, cast] = programs[i % programs.length];
  const ep = { id: `lab-${b.id}`, program: { id: pid, title: pid.toUpperCase(), theme }, cast, correspondents: { R1: b.id }, guests: { [b.id]: b } };
  stage = new Stage({ audio, channel: { presenters: {} }, idle: null });
  graphics = new Graphics({ now: () => Date.UTC(2026, 9, 12, 14, 30) });
  const seg = { source: b.label.credit.replace(/^SOURCE:\s*/, ''), quoteRef: { outlet: b.label.credit.replace(/^SOURCE:\s*/, '') } };
  scene = { episode: ep, program: ep.program, cast, anchors: { R1: { emotion: grave ? 'serious' : 'neutral' } }, images: new Map(), wall: { mode: 'logo' }, segPlan: null, focus: 'A',
    shot: 'location', shotSince: 0, subtitles: true, subtitle: WORDS, rundown: [], ticker: [{ text: 'Markets close higher after a quiet session', source: 'LEDGER DAILY' }],
    remote: { slot: 'R1', id: b.id, kind: 'restage', backdrop: 'press', grave, lat: NaN, lon: NaN, footage: null },
    recreation: recreationOf(b, seg) };
  const L = b.look;
  $('info').textContent = `${b.id} ${L.presentation}/${L.age} ${L.skin} ${L.hair.style}/${L.hair.colour} ${L.facialHair.style} ${L.glasses} ${L.wear.outfit}/${L.wear.main}${grave ? ' GRAVE' : ''}`;
}
const ctx = $('screen').getContext('2d');
function draw(t) {
  stage.frame(ctx, t, scene);
  if ($('gfx').checked) graphics.draw(ctx, t, scene);
}
$('guest').onchange = () => build();
$('grave').onchange = () => build();
let playing = !q.has('still');
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'pause' : 'play'; };
window.__lab = {
  count: guests.length,
  show(i, t = 2.2) {
    const n = Math.round(i);
    $('guest').value = String(n);
    build(n);
    playing = false;
    for (let k = 0; k <= Math.round(t * 10); k++) draw(k / 10); // from the cut: the graphics' clock runs as on air
  },
};
build();
const t0 = performance.now() / 1000;
function loop() {
  if (playing) draw(performance.now() / 1000 - t0);
  requestAnimationFrame(loop);
}
if (q.has('still')) window.__lab.show(Number($('guest').value));
loop();
</script>
</body>
</html>
