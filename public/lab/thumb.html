<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab: programme thumbnails</title>
<style>
  body { margin: 0; background: #0b0d14; color: #c8cbd8; font: 13px system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 12px 16px 4px; }
  p { margin: 0 16px 10px; color: #8a8fa3; max-width: 1000px; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 16px 16px; }
  canvas { image-rendering: pixelated; display: block; width: 768px; height: 432px; }
</style>
</head>
<body>
<h1>A full programme's thumbnail (clip/thumb.js; docs/publishing/vertical.md §6)</h1>
<p>The publishing desk composes these through window.__thumbLab.compose(spec) with one of the programme's own frames (tools/publish/upload.mjs). Here: a generated stand-in frame.</p>
<div class="grid" id="grid"></div>
<script type="module">
import { P } from '/js/palette.js';
import { THEME_ACCENT } from '/js/cast.js';
import { drawThumb, thumbLines } from '/js/clip/thumb.js';
import { drawCover, drawThumb16, pictureBox, STAGE, COVER, THUMB, ON_AIR_PICTURE } from '/js/clip/cover.js';
import { pixelate } from '/js/pixelate.js';
import { presenterSprite } from '/js/clip/sprite.js';
const mk = () => Object.assign(document.createElement('canvas'), { width: 384, height: 216 });
const load = (src) => new Promise((resolve, reject) => {
  const im = new Image();
  im.onload = () => resolve(im);
  im.onerror = reject;
  im.src = src;
});
async function compose(spec) {
  const c = mk();
  const g = c.getContext('2d');
  const frame = spec.frame ? await load(spec.frame) : null;
  const lead = spec.lead || '';
  const lines = Array.isArray(spec.lines) ? spec.lines : thumbLines(lead) || thumbLines(lead, { chars: 16, max: 3 }) || thumbLines(spec.fallback || '') || [];
  drawThumb(g, { frame, programme: spec.programme, lines, accent: spec.accent || THEME_ACCENT[spec.theme] || P.red, kicker: spec.kicker || '', side: spec.side || 'left' });
  return c.toDataURL('image/png');
}
// The packaging's covers and thumbnails (clip/cover.js; docs/publishing/thumbnails-titles.md):
//   spec { format: 'vertical'|'horizontal', variant: 'photo'|'presenter'|'words', programme, theme, accent, words,
//          photo (a URL of the story's cleared picture), photoFocus, photoFit, credit, frame (a frame of the clip, a
//          URL), kicker, grave, presenter (a cast id), emotion } -> a PNG data URL at the channel's own size (216x384 or
//          384x216). The presenter stands on the cover as the cast's own drawing, cut out (clip/sprite.js).
async function cover(spec) {
  const vertical = spec.format === 'vertical';
  const c = Object.assign(document.createElement('canvas'), vertical ? { width: COVER.w, height: COVER.h } : { width: THUMB.w, height: THUMB.h });
  const g = c.getContext('2d');
  const box = pictureBox(vertical ? 'vertical' : 'horizontal', spec.variant || 'photo');
  // the story's picture, pixelated as on air at exactly its box's size (pixelate.js: the same treatment, the same focus;
  // in a thumbnail's wide box a tall picture keeps its whole height, a face is never cut at the eyes: portraitDraw)
  // (the on-air rendition, ON_AIR_PICTURE: the cover shows a 1x crop of exactly what the clip's own picture shot shows)
  const photoFocus = Number.isFinite(spec.photoFocus) ? spec.photoFocus : 0.4;
  const photo = spec.photo ? pixelate(await load(spec.photo), ON_AIR_PICTURE.w, ON_AIR_PICTURE.h, { colors: ON_AIR_PICTURE.colors, focusY: photoFocus, fit: spec.photoFit || 'cover' }) : null;
  const photoRect = photo ? { x: 0, y: 0, w: photo.width, h: photo.height, focusY: 0.35 } : null;
  const frame = spec.frame ? await load(spec.frame) : null;
  // the clip's frame: the part of it that may show (spec.frameRect; by default the vertical picture's stage, at 1x,
  // which no caption or title covers)
  const frameRect = frame ? spec.frameRect || { ...STAGE } : null;
  // (a close single's size on a cover; a little bigger on a thumbnail, where the figure stands on the right third and
  // turns toward the words on the left: a face's gaze carries the viewer's eye where it looks, docs/publishing/attention.md)
  const sprite = spec.presenter ? presenterSprite(spec.presenter, { emotion: spec.grave ? 'serious' : spec.emotion || 'neutral', scale: vertical ? 3.4 : 3.8, yaw: vertical ? 0 : -0.3 }) : null;
  const draw = vertical ? drawCover : drawThumb16;
  draw(g, { variant: spec.variant || 'photo', programme: spec.programme, accent: spec.accent || THEME_ACCENT[spec.theme] || P.red, words: spec.words || '', photo, photoRect, credit: spec.credit || '', frame, frameRect, kicker: spec.kicker || '', grave: !!spec.grave, sprite });
  return c.toDataURL('image/png');
}
window.__thumbLab = { compose, thumbLines, cover };
// the gallery: a stand-in frame
const stand = mk();
const sg = stand.getContext('2d');
sg.fillStyle = '#1b2440';
sg.fillRect(0, 0, 384, 216);
sg.fillStyle = '#3a4a7a';
sg.fillRect(240, 40, 90, 140);
sg.fillStyle = '#e0b090';
sg.fillRect(268, 60, 34, 40);
const url = stand.toDataURL();
// the studio's own grammar: the presenter left, the wall right (the type then goes right)
sg.fillStyle = '#1b2440';
sg.fillRect(0, 0, 384, 216);
sg.fillStyle = '#3a4a7a';
sg.fillRect(30, 40, 90, 176);
sg.fillStyle = '#e0b090';
sg.fillRect(58, 60, 34, 40);
const studio = stand.toDataURL();
for (const spec of [
  { programme: 'COSMOS DESK', theme: 'space', lead: 'A rare family of barn owls moves to Manhattan', kicker: 'FULL PROGRAMME · 17 OCT' },
  { programme: 'COSMOS DESK', theme: 'space', lead: 'Long-serving ABC broadcaster Robyn Williams to leave Science Show after 51 years', kicker: 'FULL PROGRAMME · 17 OCT', side: 'right', frame: studio },
  { programme: 'PAY ATTENTION', theme: 'quiz', lines: ['THE NEWS QUIZ', 'PLAY ALONG'], kicker: 'WEEK OF 13 OCT' },
]) {
  const im = await load(await compose({ frame: url, ...spec }));
  const c = mk();
  c.getContext('2d').drawImage(im, 0, 0);
  document.getElementById('grid').append(c);
}
window.__thumbReady = true;
</script>
</body>
</html>
